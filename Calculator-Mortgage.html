<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 2px solid #3d3d3d;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-row .form-group {
            margin-bottom: 15px;
        }

        .button-group {
            margin-top: 30px;
        }

        button {
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
        }

        .calculate-btn {
            background: #48bb78;
            color: #fff;
        }

        .calculate-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #f56565;
            color: #fff;
        }

        .reset-btn:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .results {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            border: 2px solid #3d3d3d;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            color: #a0aec0;
            font-weight: 600;
        }

        .result-value {
            color: #48bb78;
            font-size: 1.3em;
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background: #3d3d3d;
            margin: 15px 0;
        }

        .info-text {
            color: #718096;
            font-size: 0.85em;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Mortgage Calculator</h1>
        
        <div class="error" id="error"></div>

        <form id="mortgageForm">
            <!-- Home Price and Down Payment -->
            <div class="input-row">
                <div class="form-group">
                    <label for="homePrice">Home Price ($)</label>
                    <input type="number" id="homePrice" placeholder="300000" value="300000" step="1000" min="0">
                    <div class="info-text">Total cost of the home</div>
                </div>
                <div class="form-group">
                    <label for="downPayment">Down Payment ($)</label>
                    <input type="number" id="downPayment" placeholder="60000" value="60000" step="1000" min="0">
                    <div class="info-text">Amount you're paying upfront</div>
                </div>
            </div>

            <!-- Interest Rate and Loan Term -->
            <div class="input-row">
                <div class="form-group">
                    <label for="interestRate">Annual Interest Rate (%)</label>
                    <input type="number" id="interestRate" placeholder="6.5" value="6.5" step="0.1" min="0" max="20">
                    <div class="info-text">Annual percentage rate (APR)</div>
                </div>
                <div class="form-group">
                    <label for="loanTerm">Loan Term (Years)</label>
                    <input type="number" id="loanTerm" placeholder="30" value="30" step="1" min="1" max="50">
                    <div class="info-text">Duration of the loan</div>
                </div>
            </div>

            <!-- Loan Amount (Calculated) -->
            <div class="form-group">
                <label for="loanAmount">Loan Amount ($)</label>
                <input type="number" id="loanAmount" placeholder="240000" readonly>
                <div class="info-text">Home price minus down payment</div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="button" class="calculate-btn" onclick="calculateMortgage()">Calculate</button>
                <button type="button" class="reset-btn" onclick="resetForm()">Reset</button>
            </div>
        </form>

        <!-- Results -->
        <div class="results" id="results">
            <div class="result-item">
                <span class="result-label">Monthly Payment</span>
                <span class="result-value" id="monthlyPayment">$0.00</span>
            </div>
            <div class="divider"></div>
            <div class="result-item">
                <span class="result-label">Total Amount Paid</span>
                <span class="result-value" id="totalPayment">$0.00</span>
            </div>
            <div class="result-item">
                <span class="result-label">Total Interest</span>
                <span class="result-value" id="totalInterest">$0.00</span>
            </div>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script>
        const homePrice = document.getElementById('homePrice');
        const downPayment = document.getElementById('downPayment');
        const loanAmount = document.getElementById('loanAmount');
        const interestRate = document.getElementById('interestRate');
        const loanTerm = document.getElementById('loanTerm');
        const resultsDiv = document.getElementById('results');

        // Update loan amount whenever home price or down payment changes
        homePrice.addEventListener('change', updateLoanAmount);
        downPayment.addEventListener('change', updateLoanAmount);

        function updateLoanAmount() {
            const price = parseFloat(homePrice.value) || 0;
            const down = parseFloat(downPayment.value) || 0;
            const loan = Math.max(0, price - down);
            loanAmount.value = loan.toFixed(2);
        }

        function calculateMortgage() {
            hideError();

            // Get values
            const price = parseFloat(homePrice.value);
            const down = parseFloat(downPayment.value);
            const rate = parseFloat(interestRate.value);
            const years = parseFloat(loanTerm.value);

            // Validation
            if (!price || price <= 0) {
                showError('Please enter a valid home price.');
                return;
            }

            if (down < 0) {
                showError('Down payment cannot be negative.');
                return;
            }

            if (down >= price) {
                showError('Down payment cannot be greater than or equal to home price.');
                return;
            }

            if (!rate || rate < 0) {
                showError('Please enter a valid interest rate.');
                return;
            }

            if (!years || years <= 0) {
                showError('Please enter a valid loan term.');
                return;
            }

            // Calculate
            const principal = price - down;
            const monthlyRate = rate / 100 / 12;
            const numberOfPayments = years * 12;

            let monthlyPayment;

            if (monthlyRate === 0) {
                // If no interest, just divide principal by number of payments
                monthlyPayment = principal / numberOfPayments;
            } else {
                // Standard mortgage formula: M = P * [r(1+r)^n] / [(1+r)^n - 1]
                monthlyPayment = 
                    (principal * (monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments))) / 
                    (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
            }

            const totalPayment = monthlyPayment * numberOfPayments;
            const totalInterest = totalPayment - principal;

            // Display results
            document.getElementById('monthlyPayment').textContent = formatCurrency(monthlyPayment, 2);
            document.getElementById('totalPayment').textContent = formatCurrency(totalPayment, 2);
            document.getElementById('totalInterest').textContent = formatCurrency(totalInterest, 2);
            
            resultsDiv.classList.add('show');
        }

        function resetForm() {
            homePrice.value = 300000;
            downPayment.value = 60000;
            interestRate.value = 6.5;
            loanTerm.value = 30;
            updateLoanAmount();
            resultsDiv.classList.remove('show');
            hideError();
        }

        // Initialize loan amount on page load
        updateLoanAmount();
    </script>
</body>
</html>
