<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        body {
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .unit-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .unit-btn {
            padding: 10px 20px;
            background: #3d3d3d;
            border: 2px solid #3d3d3d;
            color: #a0aec0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .unit-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }

        .unit-btn:hover {
            border-color: #667eea;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.95em;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            flex: 1;
        }

        .unit-label {
            min-width: 50px;
        }

        .result-section {
            background: #2d2d2d;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid #3d3d3d;
        }

        .bmi-value {
            font-size: 3.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #48bb78;
        }

        .bmi-category {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .bmi-category.show {
            display: block;
        }

        .underweight {
            background: #bee3f8;
            color: #025aa6;
        }

        .normal {
            background: #c6f6d5;
            color: #22543d;
        }

        .overweight {
            background: #feebc8;
            color: #7c2d12;
        }

        .obese {
            background: #fed7d7;
            color: #742a2a;
        }

        .bmi-description {
            color: #a0aec0;
            margin-top: 15px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .bmi-range {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3d3d3d;
        }

        .range-item {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #718096;
        }

        .range-item.underweight {
            border-left-color: #3182ce;
        }

        .range-item.normal {
            border-left-color: #22863a;
        }

        .range-item.overweight {
            border-left-color: #bf8700;
        }

        .range-item.obese {
            border-left-color: #cb2431;
        }

        .range-label {
            color: #718096;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .range-value {
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
        }

        .button-group {
            margin-bottom: 30px;
        }

        button {
            padding: 12px;
            font-weight: 600;
            font-size: 1em;
        }

        .calculate-btn {
            background: #667eea;
            color: #fff;
        }

        .calculate-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #3d3d3d;
            color: #a0aec0;
        }

        .reset-btn:hover {
            background: #4d4d4d;
            color: #fff;
        }

        .embed-btn {
            background: #48bb78;
            color: #fff;
        }

        .embed-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }

            .bmi-value {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 BMI Calculator</h1>
        <p class="subtitle">Find your Body Mass Index</p>

        <div class="error" id="error"></div>

        <!-- Unit Toggle -->
        <div class="unit-toggle">
            <button class="unit-btn active" data-unit="imperial" onclick="setUnit(this)">Imperial (lbs, in)</button>
            <button class="unit-btn" data-unit="metric" onclick="setUnit(this)">Metric (kg, cm)</button>
        </div>

        <!-- Input Section -->
        <div class="calculator-grid">
            <div class="form-group">
                <label for="weight">Weight</label>
                <div class="input-wrapper">
                    <input type="number" id="weight" placeholder="Enter weight" step="0.1" min="0">
                    <span class="unit-label" id="weightUnit">lbs</span>
                </div>
            </div>

            <div class="form-group">
                <label for="height">Height</label>
                <div class="input-wrapper">
                    <input type="number" id="height" placeholder="Enter height" step="0.1" min="0">
                    <span class="unit-label" id="heightUnit">in</span>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="calculate-btn" onclick="calculateBMI()">Calculate BMI</button>
            <button class="reset-btn" onclick="resetCalculator()">Reset</button>
            <button class="embed-btn" onclick="openEmbedModal()">Share / Embed</button>
        </div>

        <!-- Result Section -->
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="bmi-value" id="bmiResult">-</div>
            <div class="bmi-category" id="bmiCategory"></div>
            
            <div class="bmi-description" id="bmiDescription"></div>

            <div class="bmi-range">
                <div class="range-item underweight">
                    <div class="range-label">Underweight</div>
                    <div class="range-value">BMI < 18.5</div>
                </div>
                <div class="range-item normal">
                    <div class="range-label">Normal Weight</div>
                    <div class="range-value">18.5 - 24.9</div>
                </div>
                <div class="range-item overweight">
                    <div class="range-label">Overweight</div>
                    <div class="range-value">25 - 29.9</div>
                </div>
                <div class="range-item obese">
                    <div class="range-label">Obese</div>
                    <div class="range-value">BMI ≥ 30</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Embed Modal -->
    <div class="modal" id="embedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share & Embed</h2>
                <button class="close-btn" onclick="closeEmbedModal()">&times;</button>
            </div>

            <div class="embed-option">
                <label>Share this calculator</label>
                <div class="embed-code" id="shareLink"></div>
                <button class="copy-btn" onclick="copyCode('shareLink')">Copy Link</button>
            </div>

            <div class="embed-option">
                <label>Embed as iframe (HTML)</label>
                <div class="embed-code" id="iframeCode"></div>
                <button class="copy-btn" onclick="copyCode('iframeCode')">Copy Embed Code</button>
            </div>

            <div class="embed-option">
                <label>Embed as script</label>
                <div class="embed-code" id="scriptCode"></div>
                <button class="copy-btn" onclick="copyCode('scriptCode')">Copy Script</button>
            </div>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script>
        let currentUnit = 'imperial';

        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');
        const weightUnit = document.getElementById('weightUnit');
        const heightUnit = document.getElementById('heightUnit');
        const resultSection = document.getElementById('resultSection');
        const bmiResult = document.getElementById('bmiResult');
        const bmiCategory = document.getElementById('bmiCategory');
        const bmiDescription = document.getElementById('bmiDescription');
        const embedModal = document.getElementById('embedModal');

        function setUnit(buttonElement) {
            currentUnit = buttonElement.dataset.unit;
            
            // Query all unit buttons fresh each time
            const allUnitBtns = document.querySelectorAll('.unit-btn');
            allUnitBtns.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            if (currentUnit === 'metric') {
                weightUnit.textContent = 'kg';
                heightUnit.textContent = 'cm';
            } else {
                weightUnit.textContent = 'lbs';
                heightUnit.textContent = 'in';
            }

            weightInput.value = '';
            heightInput.value = '';
            resultSection.style.display = 'none';
            hideError();
        }

        function calculateBMI() {
            hideError();

            const weight = parseFloat(weightInput.value);
            const height = parseFloat(heightInput.value);

            if (!weight || weight <= 0) {
                showError('Please enter a valid weight.');
                return;
            }

            if (!height || height <= 0) {
                showError('Please enter a valid height.');
                return;
            }

            let bmi;

            if (currentUnit === 'metric') {
                // BMI = weight (kg) / height (m)^2
                const heightInMeters = height / 100;
                bmi = weight / (heightInMeters * heightInMeters);
            } else {
                // BMI = (weight (lbs) / height (in)^2) * 703
                bmi = (weight / (height * height)) * 703;
            }

            displayBMI(bmi);
        }

        function displayBMI(bmi) {
            bmiResult.textContent = bmi.toFixed(1);
            
            let category, description, className;

            if (bmi < 18.5) {
                category = 'Underweight';
                description = 'You are underweight. Consider consulting with a healthcare provider about a balanced diet and exercise plan.';
                className = 'underweight';
            } else if (bmi < 25) {
                category = 'Normal Weight';
                description = 'You have a healthy weight. Keep up your healthy lifestyle with regular exercise and balanced nutrition.';
                className = 'normal';
            } else if (bmi < 30) {
                category = 'Overweight';
                description = 'You are overweight. Consider increasing physical activity and reviewing your diet with a healthcare provider.';
                className = 'overweight';
            } else {
                category = 'Obese';
                description = 'You are in the obese category. It\'s recommended to consult with a healthcare provider for personalized guidance.';
                className = 'obese';
            }

            bmiCategory.textContent = category;
            bmiCategory.className = `bmi-category show ${className}`;
            bmiDescription.textContent = description;

            resultSection.style.display = 'block';
        }

        function resetCalculator() {
            weightInput.value = '';
            heightInput.value = '';
            resultSection.style.display = 'none';
            hideError();
        }

        function openEmbedModal() {
            // Get current URL, fallback to local path if in preview
            let currentUrl = window.location.href;
            
            // If in VS Code preview or localhost, show example
            if (currentUrl.includes('vscode-webview') || currentUrl.includes('localhost') || currentUrl.includes('127.0.0.1')) {
                currentUrl = 'https://yourdomain.com/bmi-calculator.html';
            }
            
            document.getElementById('shareLink').textContent = currentUrl;
            
            const iframeCode = `<iframe src="${currentUrl}" width="600" height="800" style="border: none; border-radius: 12px;" frameborder="0"></iframe>`;
            document.getElementById('iframeCode').textContent = iframeCode;
            
            const scriptCode = `<script src="${currentUrl}"><\/script>`;
            document.getElementById('scriptCode').textContent = scriptCode;

            embedModal.classList.add('show');
        }

        function closeEmbedModal() {
            embedModal.classList.remove('show');
        }

        // Allow Enter key to calculate
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                calculateBMI();
            }
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === embedModal) {
                closeEmbedModal();
            }
        });
    </script>
</body>
</html>
